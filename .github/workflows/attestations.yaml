name: Attestations

# Deterministic attestation checks: every commit answers who wrote it,
# and machinery changes carry their specification or the owner's
# recorded allowed defect. Label events re-evaluate the spec gate, so
# applying ignore:spec recomputes the check without a push.
# pull_request_target keeps both checks base-defined; the head enters
# only as fetched history and file listings, never as executed code.
on:
    pull_request_target:
        types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
    contents: read
    pull-requests: read

concurrency:
    group: attestations-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    authorship:
        name: ci/authorship
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  # Both the checker and identity file must come from the base.
                  # A pull request cannot change either input for its own check.
                  ref: ${{ github.event.pull_request.base.sha }}
                  fetch-depth: 0
            - name: Verify commit authorship
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: |
                  set -euo pipefail
                  git fetch --quiet origin "pull/$PR_NUMBER/head"
                  checked_out=$(git rev-parse HEAD) \
                      || { echo "could not resolve the checked-out base"; exit 1; }
                  [ "$checked_out" = "$BASE_SHA" ] \
                      || { echo "the trusted checkout does not match the pull request base"; exit 1; }
                  range_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA") \
                      || { echo "could not resolve the merge base; deepen the fetch and rerun"; exit 1; }
                  bash "$GITHUB_WORKSPACE/scripts/check-authorship" \
                      --from-ref "$range_base" \
                      --to-ref "$HEAD_SHA" \
                      --authors-file "$GITHUB_WORKSPACE/authors.yaml"

    spec:
        name: spec/presence
        runs-on: ubuntu-latest
        timeout-minutes: 3
        steps:
            - env:
                  GH_TOKEN: ${{ github.token }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
              run: |
                  set -o pipefail
                  # A rename lists both names, so moving a protected file out of
                  # its tree cannot dodge the gate.
                  files=$(gh api --paginate "repos/${{ github.repository }}/pulls/$PR_NUMBER/files?per_page=100" \
                      --jq '[.[] | .filename, (.previous_filename // empty)]' | jq -s -r 'add // [] | .[]') \
                      || { echo "could not read the changed files; rerun the check"; exit 1; }
                  protected='^(\.github/workflows/|\.githooks/|templates/|schemas/|\.macroscope/)|^(\.pre-commit-config\.yaml|\.gitleaks\.toml|authors\.yaml|scripts/check-authorship|scripts/author-identity\.py)$'
                  spec_tree='^docs/(specs|openspec)/|^docs/changes/[^/]+/specs/[^/]+/spec\.md$'
                  touched=$(printf '%s\n' "$files" | grep -E "$protected" || true)
                  if [ -z "$touched" ]; then
                      echo "no protected paths touched; no specification is required."
                      exit 0
                  fi
                  if printf '%s\n' "$files" | grep -qE "$spec_tree"; then
                      echo "protected paths ship with a specification change."
                      exit 0
                  fi
                  labels=$(gh api --paginate "repos/${{ github.repository }}/issues/$PR_NUMBER/labels?per_page=100" \
                      --jq '[.[].name]' | jq -s -r 'add // [] | .[]') \
                      || { echo "could not read the live labels; rerun the check"; exit 1; }
                  if printf '%s\n' "$labels" | grep -qx 'ignore:spec'; then
                      body=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" --jq '.body // ""') \
                          || { echo "could not read the pull request body; rerun the check"; exit 1; }
                      if printf '%s\n' "$body" | grep -qE '^ignore:spec: .+'; then
                          echo "ignore:spec allowed defect present with its reason."
                          exit 0
                      fi
                      echo "ignore:spec is applied but the body carries no 'ignore:spec: <reason>' line."
                      exit 1
                  fi
                  echo "these protected paths change without a specification or an ignore:spec allowed defect:"
                  printf '%s\n' "$touched"
                  exit 1
