name: Attestations

# Every commit answers who wrote it. pull_request_target keeps the check
# base-defined: the head enters only as fetched history, never as
# executed code.
on:
    pull_request_target:
        types: [opened, reopened, synchronize]

permissions:
    contents: read
    pull-requests: read

concurrency:
    group: attestations-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    authorship:
        name: ci/authorship
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            # The trusted base enters the worktree. The fetched head supplies
            # commit metadata only.
            # nosemgrep: yaml.github-actions.security.pull-request-target-code-checkout.pull-request-target-code-checkout
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  # Both the checker and identity file must come from the base.
                  # A pull request cannot change either input for its own check.
                  ref: ${{ github.event.pull_request.base.sha }}
                  fetch-depth: 0
                  persist-credentials: false
            - name: Verify commit authorship
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: |
                  set -euo pipefail
                  git fetch --quiet origin "pull/$PR_NUMBER/head"
                  checked_out=$(git rev-parse HEAD) \
                      || { echo "could not resolve the checked-out base"; exit 1; }
                  [ "$checked_out" = "$BASE_SHA" ] \
                      || { echo "the trusted checkout does not match the pull request base"; exit 1; }
                  range_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA") \
                      || { echo "could not resolve the merge base; deepen the fetch and rerun"; exit 1; }
                  bash "$GITHUB_WORKSPACE/scripts/check-authorship" \
                      --from-ref "$range_base" \
                      --to-ref "$HEAD_SHA" \
                      --authors-file "$GITHUB_WORKSPACE/authors.yaml"
