# Keeps the binary-release formulas on the latest upstream release.
#
# Every six hours (and on demand) each listed formula is bumped with
# bin/bump-release, which rewrites the url and sha256 lines from the
# release's checksums.txt. A change lands as a pull request on its own
# branch so brew test-bot runs on it; nothing is pushed to main here.
# A release that lacks only the Intel macOS archive still bumps the other
# archives; a later release with the Intel archive brings Intel up too.
#
# The pull request is opened with a Runewright App token instead of
# GITHUB_TOKEN because pull requests created by GITHUB_TOKEN never trigger
# other workflows, which would leave the test-bot run unstarted.
name: bump releases

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        formula: [cliproxyapi, cpa-manager-plus, multica, rust-cache]
    steps:
      # The App token opens the pull request, because a pull request that
      # GITHUB_TOKEN opens starts no other workflow, and test-bot must run.
      # It is limited to this repository and to the two scopes a bump needs.
      - name: Mint Runewright token
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.RUNEWRIGHT_APP_ID }}
          private-key: ${{ secrets.RUNEWRIGHT_APP_KEY }}
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write

      # No credential stays in the local git config. The push step below
      # names the App token in its own command.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # bin/bump-release prints "bumped <name> <old> -> <new>", then one
      # "missing: <file>" line for each Intel archive the release lacks.
      - name: Bump formula
        id: bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          out=$(bin/bump-release "Formula/${{ matrix.formula }}.rb")
          echo "$out"
          bumped=$(printf '%s\n' "$out" | grep '^bumped ' || true)
          [ -n "$bumped" ] || exit 0
          missing=$(printf '%s\n' "$out" | sed -n 's/^missing: //p' | paste -sd ' ' -)
          {
            echo "version=${bumped##* }"
            echo "missing=$missing"
          } >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.bump.outputs.version != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          FORMULA: ${{ matrix.formula }}
          VERSION: ${{ steps.bump.outputs.version }}
          MISSING: ${{ steps.bump.outputs.missing }}
        run: |
          branch="bump/$FORMULA-$VERSION"
          title="chore: $FORMULA $VERSION"
          note=""
          # The release lacks the Intel archive, so the Intel url stays on its
          # older release. This bump gets its own branch, so the run that later
          # adds the Intel archive opens a pull request of its own.
          if [ -n "$MISSING" ]; then
            branch="$branch-without-intel"
            title="$title without the Intel archive"
            note=$(printf '\n- Not in the release, so its url stays on the older release: %s' "$MISSING")
          fi
          # An open or merged pull request for this version is enough. A
          # closed one is not: a bump closed as superseded, or closed while
          # CI was broken, must be offered again.
          if gh pr list --head "$branch" --state open --json number --jq length | grep -qv '^0$' \
             || gh pr list --head "$branch" --state merged --json number --jq length | grep -qv '^0$'; then
            echo "pull request for $branch is open or merged"
            exit 0
          fi
          # A closed pull request leaves its branch behind when it was closed
          # by hand, and the push below must not fast-forward onto it.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" --delete "$branch" 2>/dev/null || true
          git config user.name "runewright[bot]"
          git config user.email "runewright[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add "Formula/$FORMULA.rb"
          git commit -m "$title" -- "Formula/$FORMULA.rb"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"
          gh pr create --base main --head "$branch" \
            --title "$title" \
            --body "$(printf '## Summary\n- Upstream release %s. Checksums copied from the release checksums.txt by bin/bump-release.%s\n\n## Release Notes\n- %s %s\n' "$VERSION" "$note" "$FORMULA" "$VERSION")"
          # Upstream ships several releases a day; an older open bump for the
          # same formula is superseded, so close it rather than leave a stack.
          gh pr list --state open --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"bump/$FORMULA-\")) | select(.headRefName != \"$branch\") | .number" \
            | while read -r old; do
                gh pr close "$old" --delete-branch -c "Superseded by the $VERSION bump."
              done
