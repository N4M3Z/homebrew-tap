name: Template Update

on:
    repository_dispatch:
        types: [template-released]
    schedule:
        - cron: "17 5 * * 3"
    workflow_dispatch: {}

permissions:
    actions: read
    contents: read
    pull-requests: read

concurrency:
    group: template-update
    cancel-in-progress: false

jobs:
    update:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  fetch-depth: 0
                  persist-credentials: false
                  ref: main

            - name: Install Copier
              run: |
                  . scripts/tool-versions
                  pipx install "copier==$COPIER_VERSION"

            - id: detect
              name: Detect template release
              env:
                  DISPATCH_TAG: ${{ github.event.client_payload.tag }}
                  DISPATCH_TEMPLATE: ${{ github.event.client_payload.template }}
              run: |
                  result=$(copier check-update --answers-file answers.yaml --output-format json)
                  update=$(printf '%s' "$result" | jq -r '.update_available')
                  latest=$(printf '%s' "$result" | jq -r '.latest_version')
                  target=$latest
                  recorded_source=$(grep -E '^_src_path:' answers.yaml | sed 's/^_src_path:[[:space:]]*//')

                  if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
                      printf '%s' "$DISPATCH_TEMPLATE" \
                          | grep -Eq '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$' \
                          || { echo "invalid template repository: $DISPATCH_TEMPLATE"; exit 1; }
                      # A dispatch for another template must not advance this
                      # repository. The recorded source's owner/repo tail
                      # compares across https, ssh, gh:, and .git spellings.
                      source_repo=$(printf '%s' "$recorded_source" | sed -E 's/\.git$//; s|^.*[:/]([^/:]+/[^/:]+)$|\1|')
                      [ "$source_repo" = "$DISPATCH_TEMPLATE" ] \
                          || { echo "dispatch names template $DISPATCH_TEMPLATE, but this repository adopted $recorded_source"; exit 1; }
                      git check-ref-format "refs/tags/$DISPATCH_TAG" \
                          || { echo "invalid template release tag: $DISPATCH_TAG"; exit 1; }
                      dispatch_version=${DISPATCH_TAG#v}
                      [ "$latest" = "$DISPATCH_TAG" ] || [ "$latest" = "$dispatch_version" ] \
                          || { echo "release dispatch $DISPATCH_TAG is superseded by $latest"; exit 1; }
                      target=$DISPATCH_TAG
                  fi

                  # Copier reports bare versions while release tags may carry a
                  # v prefix; the template's own tag list settles the form, and
                  # a target that matches no tag never reaches an update.
                  if [ "$update" = "true" ]; then
                      fetch_url=$recorded_source
                      case "$fetch_url" in gh:*) fetch_url="https://github.com/${fetch_url#gh:}" ;; esac
                      bare=${target#v}
                      listing=$(git ls-remote --tags "$fetch_url" "refs/tags/v$bare" "refs/tags/$bare") \
                          || { echo "could not list release tags on $recorded_source"; exit 1; }
                      resolved=$(printf '%s\n' "$listing" \
                          | grep -v '\^{}' | head -n 1 | sed 's|.*refs/tags/||')
                      [ -n "$resolved" ] \
                          || { echo "no release tag for $target on $recorded_source"; exit 1; }
                      target=$resolved
                  fi

                  printf '%s\n' "update=$update" "tag=$target" \
                      | tee -a "$GITHUB_OUTPUT" >/dev/null

            - id: existing
              name: Find an open update
              if: steps.detect.outputs.update == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
                  # The tag reaches the shell as data, never by expression
                  # interpolation into the script body.
                  TARGET_TAG: ${{ steps.detect.outputs.tag }}
              run: |
                  # Dispatch carries the release tag (v0.2.0) while Copier's
                  # check reports the bare version (0.2.0); both branch forms
                  # must count as the same open update.
                  # The tag reaches jq as an argument, never by splicing into
                  # the program text. pipefail keeps a failed pull request
                  # read from passing as no-open-update.
                  set -o pipefail
                  bare=${TARGET_TAG#v}
                  url=$(gh pr list --state open --limit 1000 --json headRefName,url \
                      | jq -r --arg bare "$bare" '[.[] | select((.headRefName | startswith("template-update/v" + $bare)) or (.headRefName | startswith("template-update/" + $bare)))][0].url // ""')
                  printf '%s\n' "url=$url" | tee -a "$GITHUB_OUTPUT" >/dev/null
                  [ -z "$url" ] || echo "an update pull request is already open: $url"

            - id: apply
              name: Apply template release
              if: steps.detect.outputs.update == 'true' && steps.existing.outputs.url == ''
              continue-on-error: true
              env:
                  TARGET_TAG: ${{ steps.detect.outputs.tag }}
              run: |
                  # Every path pins the detected release, so the applied tree
                  # always matches the tag the branch and pull request name.
                  copier update --answers-file answers.yaml --defaults --vcs-ref "$TARGET_TAG"

            - name: Reject unresolved update output
              if: steps.detect.outputs.update == 'true' && steps.existing.outputs.url == ''
              env:
                  APPLY_OUTCOME: ${{ steps.apply.outcome }}
              run: |
                  # A labeled begin or end marker is never legitimate text, so
                  # each blocks alone and a partially resolved conflict still
                  # fails; only a bare ======= is setext-ambiguous and passes.
                  conflicts=$(grep -RIlE --exclude-dir=.git --exclude-dir=.jj '^(<<<<<<< |>>>>>>> )' . || true)
                  rejects=$(find . -path ./.git -prune -o -path ./.jj -prune -o -type f -name '*.rej' -print)
                  if [ -n "$conflicts" ] || [ -n "$rejects" ]; then
                      [ -z "$conflicts" ] || printf '%s\n' "$conflicts"
                      [ -z "$rejects" ] || printf '%s\n' "$rejects"
                      echo "Copier left unresolved update output."
                      exit 1
                  fi
                  [ "$APPLY_OUTCOME" = "success" ] \
                      || { echo "Copier failed before producing reviewable conflicts."; exit 1; }

            - name: Stage template output
              if: steps.detect.outputs.update == 'true' && steps.existing.outputs.url == ''
              run: |
                  git add -A
                  if git diff --cached --quiet; then
                      echo "Copier reported an update but changed no files."
                      exit 1
                  fi

            - name: Install validation tools
              if: steps.detect.outputs.update == 'true' && steps.existing.outputs.url == ''
              run: bash scripts/install-tools

            - name: Validate updated repository
              if: steps.detect.outputs.update == 'true' && steps.existing.outputs.url == ''
              env:
                  RUFF_NO_CACHE: "1"
              run: make validate

            - name: Build update patch
              if: steps.detect.outputs.update == 'true' && steps.existing.outputs.url == ''
              run: |
                  unstaged=$(git diff --name-only)
                  untracked=$(git ls-files --others --exclude-standard)
                  if [ -n "$unstaged" ] || [ -n "$untracked" ]; then
                      [ -z "$unstaged" ] || printf 'Validation modified:\n%s\n' "$unstaged"
                      [ -z "$untracked" ] || printf 'Validation created:\n%s\n' "$untracked"
                      exit 1
                  fi
                  git diff --cached --binary --output=template-update.patch

            - id: credentials
              name: Detect publication credentials
              if: steps.detect.outputs.update == 'true' && steps.existing.outputs.url == ''
              env:
                  TEMPLATE_APP_ID: ${{ secrets.TEMPLATE_APP_ID || secrets.RUNEWRIGHT_APP_ID }}
                  TEMPLATE_APP_KEY: ${{ secrets.TEMPLATE_APP_KEY || secrets.RUNEWRIGHT_APP_KEY }}
              run: |
                  configured=false
                  if [ -n "$TEMPLATE_APP_ID" ] && [ -n "$TEMPLATE_APP_KEY" ]; then
                      configured=true
                  fi
                  printf 'configured=%s\n' "$configured" >> "$GITHUB_OUTPUT"

            - id: publisher
              name: Mint publication token
              if: steps.credentials.outputs.configured == 'true'
              uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
              with:
                  app-id: ${{ secrets.TEMPLATE_APP_ID || secrets.RUNEWRIGHT_APP_ID }}
                  private-key: ${{ secrets.TEMPLATE_APP_KEY || secrets.RUNEWRIGHT_APP_KEY }}

            - name: Upload update artifact
              if: steps.publisher.outputs.token == '' && steps.detect.outputs.update == 'true' && steps.existing.outputs.url == ''
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: template-update-${{ github.run_id }}
                  path: template-update.patch
                  if-no-files-found: error

            - name: Publish update pull request
              if: steps.publisher.outputs.token != '' && steps.detect.outputs.update == 'true' && steps.existing.outputs.url == ''
              env:
                  GH_TOKEN: ${{ steps.publisher.outputs.token }}
                  TARGET_TAG: ${{ steps.detect.outputs.tag }}
              run: |
                  branch="template-update/${TARGET_TAG}-${{ github.run_id }}"
                  git config user.name "template-update[bot]"
                  git config user.email "template-update[bot]@users.noreply.github.com"
                  git switch -c "$branch"
                  git commit -m "chore: update ceremony template"
                  gh auth setup-git
                  git push --set-upstream origin "$branch"
                  gh pr create \
                      --base main \
                      --head "$branch" \
                      --title "chore: update ceremony template" \
                      --body $'Apply the released ceremony template while preserving repository-local changes.\n\n## Plan\n\nReview Copier’s three-way update instead of replacing downstream files from the template.\n\n## Changes\n\n- **Template metadata** `answers.yaml`: record the released template revision.\n- **Generated files**: apply the released ceremony changes and retain downstream edits.\n\n## Testing\n\n- [x] `make validate`\n\n## Release Notes\n\n- N/A'
